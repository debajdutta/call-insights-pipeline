server {
    listen 80;
    # busybox wget in the healthcheck resolves localhost to ::1
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes such as /calls are served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
